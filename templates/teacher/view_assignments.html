<!DOCTYPE html>
<html>
<head>
    <title>Teacher Assignments</title>
</head>
<body>

<h1>Teacher Assignments</h1>

<a href="/admin/teacher/assign">
    New Assignment
</a>

<hr>

{% for assignment in assignments %}

<p>

    Teacher:
    {{ assignment.teacher.name }}

    →

    Abhyasika:
    {{ assignment.abhyasika.name }}

    <form
        method="POST"
        action="{{ url_for(
            'teacher_assignment.delete_assignment',
            id=assignment.id
        ) }}"
        class="d-inline"
        onsubmit="return confirm('Are you sure you want to remove this teacher-Abhyasika assignment?');"
    >

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <button
            type="submit"
            class="btn btn-link p-0"
        >
            Remove
        </button>

    </form>

</p>

{% endfor %}

</body>
</html>

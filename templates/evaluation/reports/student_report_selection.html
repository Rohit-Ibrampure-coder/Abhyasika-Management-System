{% extends "base.html" %}

{% block title %}
विद्यार्थी मासिक मूल्यांकन अहवाल
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <!-- Page Header -->

    <div class="mb-4">

        <h2 class="fw-bold">

            विद्यार्थी मासिक मूल्यांकन अहवाल

        </h2>

        <p class="text-muted">

            विद्यार्थी निवडा आणि मासिक मूल्यांकन अहवाल तयार करा.

        </p>

    </div>

    <!-- Selection Card -->

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <form
                method="GET"
                id="reportForm"
            >

                <div class="row g-3">

                    <!-- Abhyasika -->

                    <div class="col-md-6">

                        <label class="form-label">

                            अभ्यासिका

                        </label>

                        <select
                            class="form-select"
                            id="abhyasika_id"
                            name="abhyasika_id"

                            {% if current_user.role == "teacher" and abhyasikas|length == 1 %}
                            disabled
                            {% endif %}
                        >

                            <option value="">

                                -- अभ्यासिका निवडा --

                            </option>

                            {% for abhyasika in abhyasikas %}

                            <option
                                value="{{ abhyasika.id }}"
                                {% if selected_abhyasika == abhyasika.id %}selected{% endif %}
                            >
                                {{ abhyasika.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- Student -->

                    <div class="col-md-6">

                        <label class="form-label">

                            विद्यार्थी

                        </label>

                        <select
                            id="student_id"
                            class="form-select"
                            name="student_id"
                        >

                            <option value="">

                                -- विद्यार्थी निवडा --

                            </option>

                            {% for student in students %}

                            <option value="{{ student.id }}">

                                {{ student.student_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- Month -->

                    <div class="col-md-6">

                        <label class="form-label">

                            महिना

                        </label>

                        <select
                            class="form-select"
                            name="month"
                        >

                            {% for month_number, month_name in months.items() %}

                            <option
                                value="{{ month_number }}"
                                {% if month_number == current_month %}selected{% endif %}
                            >

                                {{ month_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- Year -->

                    <div class="col-md-6">

                        <label class="form-label">

                            वर्ष

                        </label>

                        <select
                            class="form-select"
                            name="year"
                        >

                            {% for year in years %}

                            <option
                                value="{{ year }}"
                                {% if year == current_year %}selected{% endif %}
                            >

                                {{ year }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="generateReportBtn"
                    >

                        <i class="bi bi-file-earmark-text me-2"></i>

                        Generate Report

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}

{% block js %}

<script>

const abhyasikaSelect = document.getElementById("abhyasika_id");

abhyasikaSelect.addEventListener("change", function () {

    const selectedId = this.value;

    window.location =
        "/evaluation/reports/student?abhyasika_id=" + selectedId;

});

document.addEventListener("DOMContentLoaded", function () {

    new TomSelect("#student_id", {

        placeholder: "विद्यार्थी शोधा...",

        create: false,

        maxOptions: 500

    });

});

const reportForm = document.getElementById("reportForm");

reportForm.addEventListener("submit", function (event) {

    event.preventDefault();

    const studentId =
        document.getElementById("student_id").value;

    const month =
        document.querySelector("[name='month']").value;

    const year =
        document.querySelector("[name='year']").value;

    if (!studentId) {

        Swal.fire({

            icon: "warning",

            title: "विद्यार्थी निवडा",

            text: "कृपया विद्यार्थी निवडा."

        });

        return;

    }

    window.location =
        `/evaluation/report/student/${studentId}?month=${month}&year=${year}`;

});

</script>

{% endblock %}
